# ---------------------------------------------------------------------------
# 301 redirects: OLD Hugo site URLs  ->  NEW static site URLs
#
# The previous adityan.dev (Hugo) used /about/, /posts/<slug>/, /tags/... etc.
# The new site uses /about.html, /blog/<slug>.html. Without these redirects,
# every URL Google has indexed becomes a 404 and loses its ranking history.
# A 301 passes ~all of that signal to the new URL.
#
# HOW TO USE (Dokploy / nginx):
#   Put this file where nginx serves the site and add, inside your `server { }`:
#       include /etc/nginx/conf.d/nginx-redirects.conf;
#   (or paste these lines directly into the server block).
#   Exact `location =` matches take priority over the static-file handler,
#   so they run before nginx tries to find a file.
# ---------------------------------------------------------------------------

# --- core pages ---
location = /about/     { return 301 /about.html; }
location = /projects/  { return 301 /projects.html; }
location = /posts/     { return 301 /blog.html; }

# --- blog posts (old /posts/<slug>/  ->  new /blog/<slug>.html) ---
location = /posts/uv-is-great/                          { return 301 /blog/uv-is-great.html; }
location = /posts/cursor-composer/                      { return 301 /blog/cursor-composer.html; }
location = /posts/cursor-2/                             { return 301 /blog/cursor-2.html; }
location = /posts/psf-refusing-15m-from-us-government/  { return 301 /blog/psf-refusing-15m-from-us-government.html; }
location = /posts/sora-2/                               { return 301 /blog/sora-2.html; }
location = /posts/adding-newsletters-to-my-blog/        { return 301 /blog/adding-newsletters-to-my-blog.html; }
location = /posts/chatgpt-atlas/                        { return 301 /blog/chatgpt-atlas.html; }
location = /posts/making-a-homelab/                     { return 301 /blog/making-a-homelab.html; }

# --- taxonomy pages that no longer exist -> send to the blog index ---
location ^~ /tags/       { return 301 /blog.html; }
location ^~ /categories/ { return 301 /blog.html; }
location ^~ /authors/    { return 301 /blog.html; }
location ^~ /series/     { return 301 /blog.html; }

# Safety net: any other /posts/* not listed above -> blog index
location ^~ /posts/      { return 301 /blog.html; }
