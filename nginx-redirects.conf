# ---------------------------------------------------------------------------
# 301 redirects: OLD Hugo site URLs AND the old .html URLs -> NEW clean URLs
#
# The previous adityan.dev (Hugo) used /about/, /posts/<slug>/, /tags/... etc.
# Before that, this site used /about.html, /blog/<slug>.html. The canonical
# form is now the extensionless route (/about, /blog/<slug>). Without these
# redirects, every URL Google has indexed becomes a 404 and loses its ranking
# history. A 301 passes ~all of that signal to the new URL.
#
# HOW TO USE (Dokploy / nginx):
#   The Dockerfile installs this at /etc/nginx/snippets/ and default.conf
#   includes it inside its `server { }`. Exact `location =` matches and the
#   regex rules below run before nginx tries to find a file.
# ---------------------------------------------------------------------------

# --- canonical URL form enforcement ---------------------------------------
# The new site's <link rel="canonical"> tags and sitemap.xml all use the
# extensionless form. If nginx also serves the old .html paths without
# redirecting, Google indexes two URLs per page with colliding signals.
# Redirect every alternate spelling to the one canonical form.

# /index.html is the same resource as /
location = /index.html { return 301 /; }

# old .html core pages -> extensionless canonicals
location ~ ^/(about|projects|blog|contact)\.html$ { return 301 /$1; }

# old .html blog posts -> extensionless canonicals. A regex, so posts added
# later are covered without touching this file.
location ~ ^/blog/([a-z0-9-]+)\.html$ { return 301 /blog/$1; }

# --- old Hugo site -> new site ---
location = /about/     { return 301 /about; }
location = /projects/  { return 301 /projects; }
location = /posts/     { return 301 /blog; }

# --- blog posts (old /posts/<slug>/  ->  new /blog/<slug>) ---
location ~ ^/posts/([a-z0-9-]+)/?$ { return 301 /blog/$1; }

# --- taxonomy pages that no longer exist -> send to the blog index ---
location ^~ /tags/       { return 301 /blog; }
location ^~ /categories/ { return 301 /blog; }
location ^~ /authors/    { return 301 /blog; }
location ^~ /series/     { return 301 /blog; }

# Safety net: any other /posts/* the rule above did not match -> blog index.
# Plain prefix, not `^~`, so the regex rules are still tried first.
location /posts/         { return 301 /blog; }
