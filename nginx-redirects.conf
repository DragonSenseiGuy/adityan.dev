# ---------------------------------------------------------------------------
# 301 redirects: OLD Hugo site URLs  ->  NEW static site URLs
#
# The previous adityan.dev (Hugo) used /about/, /posts/<slug>/, /tags/... etc.
# The new site uses /about.html, /blog/<slug>.html. Without these redirects,
# every URL Google has indexed becomes a 404 and loses its ranking history.
# A 301 passes ~all of that signal to the new URL.
#
# HOW TO USE (Dokploy / nginx):
#   The Dockerfile installs this at /etc/nginx/snippets/ and default.conf
#   includes it inside its `server { }`. Exact `location =` matches and the
#   regex rules below run before nginx tries to find a file.
# ---------------------------------------------------------------------------

# --- canonical URL form enforcement ---------------------------------------
# The new site's <link rel="canonical"> tags and sitemap.xml all use the
# `.html` form. If nginx (or a try_files fallback) also serves the bare
# extensionless paths, Google indexes two URLs per page with colliding
# signals. Redirect every alternate spelling to the one canonical form.

# /index.html is the same resource as /
location = /index.html { return 301 /; }

# extensionless core pages -> .html canonicals
location = /about      { return 301 /about.html; }
location = /projects   { return 301 /projects.html; }
location = /blog       { return 301 /blog.html; }
location = /contact    { return 301 /contact.html; }

# extensionless blog posts -> .html canonicals. A regex, so posts added later
# are covered without touching this file.
location ~ ^/blog/([a-z0-9-]+)$ { return 301 /blog/$1.html; }

# --- old Hugo site -> new site ---
location = /about/     { return 301 /about.html; }
location = /projects/  { return 301 /projects.html; }
location = /posts/     { return 301 /blog.html; }

# --- blog posts (old /posts/<slug>/  ->  new /blog/<slug>.html) ---
location ~ ^/posts/([a-z0-9-]+)/?$ { return 301 /blog/$1.html; }

# --- taxonomy pages that no longer exist -> send to the blog index ---
location ^~ /tags/       { return 301 /blog.html; }
location ^~ /categories/ { return 301 /blog.html; }
location ^~ /authors/    { return 301 /blog.html; }
location ^~ /series/     { return 301 /blog.html; }

# Safety net: any other /posts/* the rule above did not match -> blog index.
# Plain prefix, not `^~`, so the regex rules are still tried first.
location /posts/         { return 301 /blog.html; }
