<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - DragonSenseiGuy</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<section class="blog-section">
    <div class="container">
        <a href="{{ url_for('home') }}" class="back-link">← Back to Home</a>
        <h1 class="title is-2 section-title has-text-centered">Blog</h1>
        
        <div class="columns is-multiline is-centered">
            {% for post in posts %}
            <div class="column is-6">
                <a href="{{ url_for('blog_post', slug=post.slug) }}" class="blog-card-link">
                    <div class="card blog-card">
                        <div class="card-content">
                            <p class="title is-4">{{ post.title }}</p>
                            <p class="subtitle is-6 blog-date">{{ post.pubDate }}</p>
                            <div class="content blog-description">
                                {{ post.description }}
                            </div>
                        </div>
                    </div>
                </a>
            </div>
            {% else %}
            <div class="column is-12 has-text-centered">
                <p class="has-text-white">No blog posts yet.</p>
            </div>
            {% endfor %}
        </div>
    </div>
</section>

</body>
</html>
