server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Old Hugo URLs -> new URLs, and canonical-form enforcement.
    include /etc/nginx/snippets/nginx-redirects.conf;

    # Homepage: serve index.html for "/" without exposing directory listing
    # semantics anywhere else.
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/xml
               application/json image/svg+xml;

    location ~* \.(?:png|jpe?g|gif|ico|svg|otf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public";
    }
}
