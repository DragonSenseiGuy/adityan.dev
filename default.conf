server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Old Hugo URLs -> new URLs, and canonical-form enforcement.
    include /etc/nginx/snippets/nginx-redirects.conf;

    # Homepage: serve index.html for "/" without exposing directory listing
    # semantics anywhere else.
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }

    # Custom error pages. `internal` keeps them from being served (and indexed)
    # as ordinary URLs — they only ever appear as an error response body.
    error_page 404 /404.html;
    location = /404.html { internal; }

    error_page 500 502 503 504 /500.html;
    location = /500.html { internal; }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/xml
               application/rss+xml application/json image/svg+xml;

    location ~* \.(?:png|jpe?g|gif|ico|svg|otf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Social cards keep their filename when their page's copy changes, so they
    # are cached but never immutable.
    location ^~ /og/ {
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public";
    }
}
