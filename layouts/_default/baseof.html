<!DOCTYPE html>
<html lang="en">
<head>
  <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>
  {{ partial "head/meta-tags.html" . }}
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
  <link rel="icon" href="/images/favicon.ico" sizes="32x32">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --red: #FF0000;
      --black: #000;
      --white: #FFF;
      --bone: #F2F0EB;
      --border: 4px solid var(--black);
      --border-thick: 8px solid var(--black);
    }

    html { scroll-behavior: auto; }

    body {
      font-family: 'Courier New', 'Lucida Console', monospace;
      background: var(--bone);
      color: var(--black);
      overflow-x: hidden;
    }

    ::selection {
      background: var(--red);
      color: var(--white);
    }

    a {
      color: inherit;
      text-decoration: none;
      border-bottom: 3px solid var(--red);
      font-weight: 700;
      cursor: pointer;
      transition: background 200ms ease, color 200ms ease;
    }
    a:hover {
      background: var(--red);
      color: var(--white);
      border-bottom-color: var(--red);
    }

    h1, h2, h3, h4, .heading {
      font-family: 'Archivo Black', Impact, sans-serif;
      text-transform: uppercase;
      line-height: 0.9;
      letter-spacing: -0.02em;
    }

    /* ===== GRID SCAFFOLD ===== */
    .grid-lines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.025;
      background:
        repeating-linear-gradient(90deg, var(--black) 0 1px, transparent 1px 100px),
        repeating-linear-gradient(0deg, var(--black) 0 1px, transparent 1px 100px);
    }

    /* ===== NAV ===== */
    .site-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: var(--black);
      color: var(--white);
      border-bottom: 6px solid var(--red);
      display: flex;
      justify-content: space-between;
      align-items: stretch;
    }

    .nav-logo {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.3rem;
      color: var(--white);
      border-bottom: none;
      padding: 14px 24px;
      letter-spacing: 3px;
      display: flex;
      align-items: center;
      border-right: 2px solid var(--red);
    }
    .nav-logo:hover {
      background: var(--red);
    }

    .nav-links {
      display: flex;
    }

    .nav-links a {
      color: var(--white);
      border-bottom: none;
      border-left: 2px solid rgba(255,0,0,0.4);
      padding: 14px 22px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 700;
      display: flex;
      align-items: center;
    }
    .nav-links a:hover {
      background: var(--red);
      color: var(--white);
    }

    /* ===== HERO ===== */
    .hero {
      margin-top: 54px;
      min-height: 100vh;
      border-bottom: var(--border-thick);
      position: relative;
    }

    .hero-main {
      padding: 100px 56px 56px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
      min-height: 100vh;
    }

    .hero-main::before {
      content: 'AD';
      position: absolute;
      font-family: 'Archivo Black', sans-serif;
      font-size: 40vw;
      color: rgba(255,0,0,0.04);
      bottom: -10%;
      right: -5%;
      line-height: 0.8;
      pointer-events: none;
      transform: rotate(-8deg);
    }

    .hero-name {
      font-size: clamp(3.5rem, 9vw, 8rem);
      position: relative;
      z-index: 2;
    }

    .hero-name .slash {
      color: var(--red);
      display: inline;
    }

    .hero-name-sub {
      display: block;
      font-size: clamp(2.5rem, 6vw, 5.5rem);
      transform: rotate(-2deg);
      transform-origin: left;
      margin-top: -4px;
      margin-left: 12px;
      background: var(--red);
      color: var(--white);
      padding: 2px 16px;
      display: inline-block;
    }

    .hero-tagline {
      margin-top: 32px;
      font-size: 1.1rem;
      max-width: 520px;
      line-height: 1.7;
      border-left: 6px solid var(--red);
      padding-left: 20px;
      position: relative;
      z-index: 2;
    }

    .hero-panel {
      background: var(--black);
      color: var(--white);
      padding: 48px 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0;
      font-size: 0.82rem;
      position: relative;
      overflow: hidden;
    }

    .hero-panel::after {
      content: '';
      position: absolute;
      top: -30px;
      right: -30px;
      width: 180px;
      height: 180px;
      border: 8px solid var(--red);
      transform: rotate(12deg);
      pointer-events: none;
    }

    .terminal-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      padding: 14px 0;
    }
    .terminal-row:last-child { border-bottom: none; }

    .terminal-key {
      text-transform: uppercase;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.5);
      font-size: 0.7rem;
    }

    .terminal-val {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.1rem;
      color: var(--red);
      text-align: right;
    }

    .terminal-val.white { color: var(--white); }

    .badge {
      display: inline-block;
      margin-top: 28px;
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.6rem;
      text-transform: uppercase;
      background: var(--red);
      color: var(--white);
      padding: 8px 20px;
      transform: rotate(3deg);
      align-self: flex-start;
    }

    /* ===== TICKER ===== */
    .ticker {
      background: var(--red);
      color: var(--white);
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 5px;
      padding: 10px 0;
      overflow: hidden;
      white-space: nowrap;
      border-bottom: var(--border-thick);
    }

    .ticker-inner {
      display: inline-block;
      animation: scroll 22s linear infinite;
    }

    @keyframes scroll {
      to { transform: translateX(-50%); }
    }

    /* ===== ABOUT ===== */
    .about {
      display: grid;
      grid-template-columns: 180px 1fr;
      min-height: 60vh;
      border-bottom: var(--border-thick);
    }

    .about-sidebar {
      background: var(--black);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: var(--border-thick);
      writing-mode: vertical-lr;
    }

    .about-sidebar h2 {
      font-size: 3.5rem;
      letter-spacing: 8px;
      transform: rotate(180deg);
    }

    .about-body {
      padding: 64px 56px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .about-body::before {
      content: '//';
      position: absolute;
      top: 20px;
      right: 30px;
      font-family: 'Archivo Black', sans-serif;
      font-size: 14rem;
      color: rgba(0,0,0,0.03);
      line-height: 1;
      pointer-events: none;
    }

    .about-body p {
      font-size: 1.1rem;
      line-height: 1.8;
      max-width: 620px;
      margin-bottom: 20px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
    }

    .tags span {
      border: 3px solid var(--black);
      padding: 5px 14px;
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .tags span:nth-child(odd) {
      transform: rotate(-1.5deg);
      background: var(--red);
      color: var(--white);
      border-color: var(--red);
    }
    .tags span:nth-child(even) {
      transform: rotate(1.5deg);
    }

    /* ===== COLLISION STRIP ===== */
    .collision {
      position: relative;
      height: 130px;
      overflow: hidden;
      border-bottom: var(--border-thick);
    }

    .collision span {
      position: absolute;
      font-family: 'Archivo Black', sans-serif;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .collision span:nth-child(1) { font-size: 4.5rem; top: 8px; left: 3%; transform: rotate(-3deg); color: var(--red); }
    .collision span:nth-child(2) { font-size: 2rem; top: 45px; left: 28%; transform: rotate(5deg); border: 4px solid var(--black); padding: 2px 14px; }
    .collision span:nth-child(3) { font-size: 5.5rem; top: 10px; left: 50%; transform: rotate(-1.5deg); opacity: 0.07; }
    .collision span:nth-child(4) { font-size: 1.4rem; top: 75px; left: 76%; transform: rotate(4deg); background: var(--black); color: var(--white); padding: 4px 18px; }

    /* ===== PROJECTS ===== */
    .projects {
      border-bottom: var(--border-thick);
    }

    .section-bar {
      background: var(--red);
      color: var(--white);
      padding: 28px 56px;
      border-bottom: var(--border-thick);
      position: relative;
      overflow: hidden;
    }

    .section-bar h2 {
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      transform: rotate(-1deg);
    }

    .section-bar .num {
      position: absolute;
      top: -16px;
      right: 40px;
      font-family: 'Archivo Black', sans-serif;
      font-size: 9rem;
      opacity: 0.2;
      line-height: 1;
    }

    .project-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .project-card {
      padding: 40px 36px;
      border: var(--border);
      min-height: 260px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .project-card {
      cursor: pointer;
      transition: background 200ms ease, color 200ms ease;
    }

    .project-card:hover {
      background: var(--black);
      color: var(--white);
    }

    .project-card:nth-child(1) { transform: rotate(0.6deg); }
    .project-card:nth-child(2) { transform: rotate(-0.4deg); }
    .project-card:nth-child(3) { transform: rotate(-0.6deg); margin-top: -6px; }
    .project-card:nth-child(4) { transform: rotate(0.9deg); margin-top: -6px; }

    .project-card::before {
      content: attr(data-n);
      position: absolute;
      top: -24px;
      right: 8px;
      font-family: 'Archivo Black', sans-serif;
      font-size: 9rem;
      opacity: 0.05;
      line-height: 1;
      pointer-events: none;
    }
    .project-card:hover::before { color: var(--red); opacity: 0.25; }

    .project-name {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.8rem;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .project-desc {
      font-size: 0.9rem;
      line-height: 1.6;
      max-width: 380px;
    }

    .project-type {
      display: inline-block;
      margin-top: 16px;
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      border-bottom: 3px solid var(--red);
      padding-bottom: 2px;
    }

    /* ===== INTERESTS ===== */
    .interests {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: var(--border-thick);
    }

    .interest {
      padding: 48px 28px;
      border-right: var(--border);
      min-height: 280px;
      position: relative;
      overflow: hidden;
    }
    .interest:last-child { border-right: none; }

    .interest {
      cursor: pointer;
      transition: background 200ms ease, color 200ms ease;
    }

    .interest:hover {
      background: var(--black);
      color: var(--white);
    }

    .interest-icon {
      font-size: 3.5rem;
      display: block;
      transform: rotate(-5deg);
      margin-bottom: 14px;
    }

    .interest h3 {
      font-size: 1.4rem;
      margin-bottom: 10px;
      transform: rotate(1deg);
    }

    .interest p {
      font-size: 0.85rem;
      line-height: 1.7;
    }

    .interest::after {
      content: '';
      position: absolute;
      bottom: -35px;
      right: -35px;
      width: 110px;
      height: 110px;
      border: 6px solid var(--red);
      transform: rotate(22deg);
      opacity: 0.12;
      pointer-events: none;
    }

    /* ===== CONNECT ===== */
    .connect {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: var(--border-thick);
    }

    .connect-block {
      padding: 56px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .connect-block:first-child {
      background: var(--black);
      color: var(--white);
      border-right: var(--border-thick);
    }

    .connect-block:last-child {
      background: var(--red);
      color: var(--white);
    }

    .connect-heading {
      font-family: 'Archivo Black', sans-serif;
      font-size: clamp(1.8rem, 4vw, 3.2rem);
      text-transform: uppercase;
      transform: rotate(-2deg);
      margin-bottom: 14px;
    }

    .connect-link {
      color: var(--white);
      border-bottom: 3px solid var(--white);
      padding: 6px 0;
      font-size: 0.95rem;
      letter-spacing: 1px;
      display: inline-block;
      cursor: pointer;
      transition: background 200ms ease, color 200ms ease, padding 200ms ease;
    }
    .connect-link:hover {
      background: var(--white);
      color: var(--black);
      padding: 6px 12px;
    }

    .connect-block::before {
      content: '→';
      position: absolute;
      right: 36px;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'Archivo Black', sans-serif;
      font-size: 6rem;
      opacity: 0.12;
      pointer-events: none;
    }

    /* ===== FOOTER ===== */
    footer {
      background: var(--black);
      color: var(--white);
      padding: 28px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    footer span {
      border-bottom: 2px solid var(--red);
      padding-bottom: 3px;
    }

    /* ===== CONTENT PAGES ===== */
    .page-wrap {
      margin-top: 54px;
      padding: 80px 56px;
      max-width: 960px;
      position: relative;
    }

    .page-header {
      position: relative;
      margin-bottom: 24px;
      border-bottom: var(--border-thick);
      padding-bottom: 24px;
    }

    .page-title {
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      transform: rotate(-1deg);
    }

    .page-title-ghost {
      position: absolute;
      top: -28px;
      right: 0;
      font-family: 'Archivo Black', sans-serif;
      font-size: 10rem;
      opacity: 0.04;
      line-height: 1;
      pointer-events: none;
      text-transform: uppercase;
    }

    .tags-browse {
      display: inline-block;
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--white);
      background: var(--red);
      border: none;
      border-bottom: none;
      padding: 8px 18px;
    }
    .tags-browse:hover {
      background: var(--black);
      color: var(--white);
    }

    /* ===== POST LIST ===== */
    .post-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .post-item {
      display: block;
      padding: 28px 32px;
      border: var(--border);
      border-bottom: none;
      border-left: 6px solid var(--red);
      position: relative;
      overflow: hidden;
    }
    .post-item:last-child { border-bottom: var(--border); }
    .post-item:nth-child(even) { border-left-color: var(--black); }
    .post-item:hover {
      background: var(--black);
      color: var(--white);
    }
    .post-item:hover .post-item-desc { color: rgba(255,255,255,0.6); }
    .post-item:hover .post-item-date { color: var(--red); }

    .post-item-inner {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
    }

    .post-item-title {
      font-size: 1.1rem;
      letter-spacing: 1px;
      margin: 0;
    }

    .post-item-date {
      font-size: 0.7rem;
      color: rgba(0,0,0,0.5);
      letter-spacing: 2px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .post-item-desc {
      font-size: 0.85rem;
      color: rgba(0,0,0,0.6);
      margin-top: 8px;
      line-height: 1.6;
    }

    /* ===== ARTICLE ===== */
    .article-wrap {
      margin-top: 54px;
      padding: 80px 56px;
      max-width: 860px;
    }

    .article-header {
      margin-bottom: 48px;
      padding-bottom: 28px;
      border-bottom: var(--border-thick);
      position: relative;
    }

    .article-title {
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1;
      margin-bottom: 20px;
    }

    .article-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .article-meta time {
      font-size: 0.75rem;
      color: rgba(0,0,0,0.5);
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 3px solid var(--red);
      padding: 4px 14px;
      display: inline-block;
    }

    .article-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .article-tags .tag {
      padding: 4px 12px;
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: var(--black);
      color: var(--white);
    }

    .article-content {
      font-size: 1rem;
      line-height: 1.85;
    }
    .article-content h2 {
      font-size: 1.8rem;
      margin: 48px 0 20px;
      padding-left: 16px;
      border-left: 6px solid var(--red);
    }
    .article-content h3 {
      font-size: 1.3rem;
      margin: 36px 0 14px;
      color: var(--red);
    }
    .article-content h4 {
      font-size: 1.1rem;
      margin: 28px 0 10px;
    }
    .article-content p {
      margin-bottom: 20px;
    }
    .article-content a {
      color: var(--red);
      border-bottom: 2px solid var(--red);
    }
    .article-content a:hover {
      background: var(--red);
      color: var(--white);
    }
    .article-content ul, .article-content ol {
      margin: 16px 0 24px 24px;
    }
    .article-content li {
      margin-bottom: 8px;
      line-height: 1.7;
    }
    .article-content blockquote {
      border-left: 6px solid var(--red);
      padding: 16px 24px;
      margin: 24px 0;
      background: var(--black);
      color: var(--white);
      font-style: italic;
    }
    .article-content pre {
      background: var(--black);
      color: var(--white);
      border: var(--border);
      padding: 24px;
      overflow-x: auto;
      margin: 24px 0;
      font-size: 0.88rem;
      line-height: 1.5;
    }
    .article-content code {
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
    }
    .article-content pre code {
      background: transparent;
      border: none;
      padding: 0;
    }
    .article-content code:not(pre code) {
      background: var(--black);
      color: var(--red);
      border: 2px solid rgba(0,0,0,0.2);
      padding: 2px 6px;
      font-size: 0.85em;
    }
    .article-content img {
      max-width: 100%;
      border: var(--border-thick);
      margin: 24px 0;
    }
    .article-content hr {
      border: none;
      height: 4px;
      background: var(--red);
      margin: 40px 0;
    }
    .article-content iframe {
      border: var(--border) !important;
      max-width: 100%;
    }

    /* ===== HEADING ANCHORS ===== */
    .heading-anchor {
      color: rgba(0,0,0,0.2);
      border-bottom: none;
      font-weight: 700;
      margin-left: 8px;
    }
    .heading-anchor:hover {
      background: none;
      color: rgba(0,0,0,0.4);
    }

    /* ===== PROJECT CARDS (content page) ===== */
    .page-wrap .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0;
    }

    .page-wrap .card {
      padding: 36px 32px;
      border: var(--border);
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    .page-wrap .card:hover {
      background: var(--black);
      color: var(--white);
    }
    .page-wrap .card:hover p { color: rgba(255,255,255,0.7); }
    .page-wrap .card:hover a { color: var(--white); border-bottom-color: var(--white); }
    .page-wrap .card:nth-child(odd) { transform: rotate(0.5deg); }
    .page-wrap .card:nth-child(even) { transform: rotate(-0.5deg); }

    .page-wrap .card h3 {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .page-wrap .card p {
      font-size: 0.88rem;
      line-height: 1.7;
      color: rgba(0,0,0,0.7);
      margin-bottom: 16px;
    }
    .page-wrap .card a {
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      border-bottom: 3px solid var(--red);
      padding-bottom: 2px;
      display: inline-block;
    }

    /* ===== ERROR PAGES ===== */
    .error-page {
      margin-top: 54px;
      min-height: calc(100vh - 54px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: var(--border-thick);
    }

    .error-code {
      background: var(--black);
      color: var(--red);
      font-family: 'Archivo Black', sans-serif;
      font-size: clamp(8rem, 20vw, 20rem);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      border-right: var(--border-thick);
      position: relative;
      overflow: hidden;
    }
    .error-code::after {
      content: '';
      position: absolute;
      bottom: -40px;
      right: -40px;
      width: 200px;
      height: 200px;
      border: 8px solid var(--red);
      transform: rotate(15deg);
      pointer-events: none;
    }

    .error-message {
      padding: 80px 56px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .error-message h1 {
      font-size: clamp(2rem, 4vw, 3.5rem);
      margin-bottom: 16px;
    }
    .error-message p {
      font-size: 1.1rem;
      line-height: 1.7;
      max-width: 400px;
      margin-bottom: 32px;
    }
    .error-link {
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      background: var(--red);
      color: var(--white);
      border: none;
      border-bottom: none;
      padding: 14px 28px;
      display: inline-block;
      cursor: pointer;
      transition: background 200ms ease;
    }
    .error-link:hover {
      background: var(--black);
      color: var(--white);
    }

    @media (max-width: 900px) {
      .error-page { grid-template-columns: 1fr; }
      .error-code {
        border-right: none;
        border-bottom: var(--border-thick);
        padding: 60px 28px;
        font-size: 6rem;
        min-height: auto;
      }
      .error-message { padding: 48px 28px; }
    }

    /* ===== POST LIST TOOLBAR ===== */
    .post-list-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .post-list-toolbar-bottom {
      margin-bottom: 0;
      margin-top: 16px;
    }

    /* ===== PAGINATION ===== */
    .pagination-inline {
      display: flex;
      align-items: center;
      gap: 0;
      border: var(--border);
    }

    .pagination-link {
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.85rem;
      padding: 8px 14px;
      border-bottom: none;
      cursor: pointer;
      transition: background 200ms ease, color 200ms ease;
    }
    .pagination-link:hover {
      background: var(--red);
      color: var(--white);
    }

    .pagination-info {
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.85rem;
      padding: 8px 14px;
      white-space: nowrap;
    }

    .pagination-inline > * + * {
      border-left: var(--border);
    }

    /* ===== TAGS GRID ===== */
    .tags-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0;
    }

    .tag-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 20px;
      border: var(--border);
      border-bottom: none;
      cursor: pointer;
      transition: background 200ms ease, color 200ms ease;
    }
    .tag-card:last-child { border-bottom: var(--border); }
    .tag-card:hover {
      background: var(--black);
      color: var(--white);
    }

    .tag-name {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .tag-count {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.4rem;
      color: var(--red);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 900px) {
      .hero-main {
        padding: 100px 28px 48px;
      }
      .about { grid-template-columns: 1fr; }
      .about-sidebar {
        writing-mode: horizontal-tb;
        border-right: none;
        border-bottom: var(--border-thick);
        padding: 20px 28px;
      }
      .about-sidebar h2 {
        transform: none;
        font-size: 2.5rem;
      }
      .about-body { padding: 36px 28px; }
      .project-grid { grid-template-columns: 1fr; }
      .project-card { transform: none !important; margin-top: 0 !important; }
      .interests { grid-template-columns: 1fr; }
      .interest { border-right: none; border-bottom: var(--border); }
      .connect { grid-template-columns: 1fr; }
      .connect-block:first-child { border-right: none; border-bottom: var(--border-thick); }
      .collision { display: none; }
      footer { flex-direction: column; gap: 10px; text-align: center; }
      .nav-logo { font-size: 1rem; padding: 12px 16px; }
      .nav-links a { padding: 12px 12px; font-size: 0.7rem; letter-spacing: 2px; }
      .section-bar { padding: 24px 28px; }
      .page-wrap { padding: 60px 28px; }
      .article-wrap { padding: 60px 28px; }
      .page-wrap .cards { grid-template-columns: 1fr; }
      .page-wrap .card { transform: none !important; }
      .tags-grid { grid-template-columns: 1fr; }
      .pagination-link { padding: 12px 16px; font-size: 0.6rem; }
    }

    @media (max-width: 500px) {
      .hero-name { font-size: 2.6rem; }
      .section-bar h2 { font-size: 2rem; }
      .page-wrap { padding: 40px 16px; }
      .article-wrap { padding: 40px 16px; }
      .page-title { font-size: 2rem; }
      .article-title { font-size: 1.8rem; }
      .post-item { padding: 20px 16px; }
      .post-item-inner { flex-direction: column; gap: 4px; }
    }

    /* ===== FOCUS STATES ===== */
    a:focus-visible,
    .project-card:focus-visible,
    .interest:focus-visible,
    .connect-link:focus-visible,
    .nav-links a:focus-visible {
      outline: 3px solid var(--red);
      outline-offset: 2px;
    }

    /* ===== REDUCED MOTION ===== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .ticker-inner { animation: none; }
      .hero-name-sub { transform: none; }
      .project-card,
      .page-wrap .card { transform: none !important; }
      .tags span { transform: none; }
    }

    /* ===== SCROLL REVEAL TRANSITION ===== */
    .project-card,
    .interest,
    .connect-block {
      transition: opacity 0.4s ease, background 200ms ease, color 200ms ease;
    }
  </style>
</head>
<body>

<div class="grid-lines"></div>

{{ partial "nav.html" . }}

{{ block "content" . }}{{ end }}

{{ partial "footer.html" . }}

<script>
  // Duplicate ticker content for seamless loop
  var t = document.querySelector('.ticker-inner');
  if (t) { t.innerHTML += t.innerHTML; }

  // Snap-in reveal on scroll
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (e.isIntersecting) {
        e.target.style.opacity = '1';
        obs.unobserve(e.target);
      }
    });
  }, { threshold: 0.12 });

  document.querySelectorAll('.project-card, .interest, .connect-block').forEach(function(el) {
    el.style.opacity = '0';
    obs.observe(el);
  });

  // Glitch on hero name hover
  var name = document.querySelector('.hero-name');
  var gid;
  if (name) {
    name.addEventListener('mouseenter', function() {
      var c = 0;
      gid = setInterval(function() {
        var x = (Math.random() - 0.5) * 10;
        var y = (Math.random() - 0.5) * 6;
        name.style.transform = 'translate(' + x + 'px,' + y + 'px)';
        if (++c > 8) { clearInterval(gid); name.style.transform = 'none'; }
      }, 50);
    });
    name.addEventListener('mouseleave', function() {
      clearInterval(gid);
      name.style.transform = 'none';
    });
  }
</script>
</body>
</html>
