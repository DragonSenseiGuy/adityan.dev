# ---------------------------------------------------------------------------
# Security headers, matching what the old Caddy site sent.
#
# This is a snippet rather than three lines in the server block because nginx's
# add_header does NOT inherit into a location that declares its own: the moment
# a block adds Cache-Control, it silently drops everything from the level above.
# Every location here that sets a header includes this file too.
#
# `always` sends them on error and redirect responses as well, not just 2xx —
# otherwise the 301s and the 404 page would go out bare.
# ---------------------------------------------------------------------------

# Trust the Content-Type we send; never guess it from the bytes.
add_header X-Content-Type-Options "nosniff" always;

# Framing is allowed from this origin only — blocks other sites embedding the
# pages, without ruling out embedding one page of mine in another.
add_header X-Frame-Options "SAMEORIGIN" always;

# Outbound links leak the origin, not the full URL: a reader clicking through
# to another site does not hand it the title of the post they came from.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
